<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="55%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow1" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#022C22" flood-opacity="0.38"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg1)"/>
  <!-- Top Gloss Highlight -->
  <path d="M 0 112 Q 0 0 112 0 L 400 0 Q 512 0 512 112 L 512 200 Q 256 260 0 200 Z" fill="#FFFFFF" opacity="0.1"/>
  <!-- Inner Traditional Seal Border -->
  <rect x="44" y="44" width="424" height="424" rx="84" fill="none" stroke="url(#gold1)" stroke-width="6" opacity="0.65"/>
  <!-- Main Chinese Character 汉 -->
  <text x="256" y="318" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="250" font-weight="900" fill="#FFFFFF" text-anchor="middle" filter="url(#shadow1)">汉</text>
  <!-- Bottom HSK Gold Pill -->
  <rect x="176" y="382" width="160" height="48" rx="24" fill="url(#gold1)" filter="url(#shadow1)"/>
  <text x="256" y="415" font-family="'Nunito', system-ui, sans-serif" font-size="28" font-weight="900" fill="#064E3B" text-anchor="middle" letter-spacing="2">HSK 1–5</text>
</svg>
