<!-- Last updated: August 31, 2026 - Added HSK filters, search bar, and streak tracker -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Learn Chinese HSK vocabulary with flashcards, quizzes, and stroke order animations">
    <meta name="theme-color" content="#C41E3A">
    <title>Easy Chinese - Learn HSK Vocabulary</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1 class="app-title">Easy Chinese</h1>
            <div class="header-stats">
                <div class="streak-tracker">
                    <span class="streak-icon">🔥</span>
                    <span class="streak-count" id="streakCount">0</span>
                    <span class="streak-label">day streak</span>
                </div>
                <div class="progress-tracker">
                    <span class="progress-icon">📚</span>
                    <span class="progress-count" id="totalLearned">0</span>
                    <span class="progress-label">learned</span>
                </div>
            </div>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                <span class="sun-icon">☀️</span>
                <span class="moon-icon">🌙</span>
            </button>
        </div>
    </header>

    <main class="main-content">
        <!-- Dashboard View -->
        <section id="dashboard" class="view active">
            <h2 class="section-title">Select HSK Level</h2>
            <div class="hsk-grid">
                <button class="hsk-btn" data-hsk="1">
                    <span class="hsk-number">1</span>
                    <span class="hsk-label">HSK 1</span>
                </button>
                <button class="hsk-btn" data-hsk="2">
                    <span class="hsk-number">2</span>
                    <span class="hsk-label">HSK 2</span>
                </button>
                <button class="hsk-btn" data-hsk="3">
                    <span class="hsk-number">3</span>
                    <span class="hsk-label">HSK 3</span>
                </button>
                <button class="hsk-btn" data-hsk="4">
                    <span class="hsk-number">4</span>
                    <span class="hsk-label">HSK 4</span>
                </button>
                <button class="hsk-btn" data-hsk="5">
                    <span class="hsk-number">5</span>
                    <span class="hsk-label">HSK 5</span>
                </button>
            </div>
        </section>

        <!-- Lessons View -->
        <section id="lessons" class="view">
            <button class="back-btn" id="backToDashboard">← Back to Dashboard</button>
            <h2 class="section-title" id="lessonsTitle">HSK 1 Lessons</h2>
            
            <!-- HSK Level Filters -->
            <div class="hsk-filters">
                <button class="hsk-filter-btn active" data-hsk="all">All Levels</button>
                <button class="hsk-filter-btn" data-hsk="1">HSK 1</button>
                <button class="hsk-filter-btn" data-hsk="2">HSK 2</button>
                <button class="hsk-filter-btn" data-hsk="3">HSK 3</button>
            </div>
            
            <!-- Search Bar -->
            <div class="search-container">
                <input type="text" class="search-input" id="searchInput" placeholder="Search by Uzbek, Pinyin, or Hanzi...">
                <button class="search-clear" id="searchClear" aria-label="Clear search">✕</button>
            </div>
            
            <div class="lessons-grid" id="lessonsGrid"></div>
        </section>

        <!-- Lesson View -->
        <section id="lesson" class="view">
            <button class="back-btn" id="backToLessons">← Back to Lessons</button>
            <h2 class="section-title" id="lessonTitle">Lesson 1</h2>
            
            <div class="mode-tabs">
                <button class="tab-btn active" data-mode="flashcard">Flashcards</button>
                <button class="tab-btn" data-mode="quiz">Quiz</button>
            </div>

            <!-- Flashcard Mode -->
            <div id="flashcardMode" class="mode-content active">
                <div class="flashcard-container">
                    <div class="flashcard" id="flashcard">
                        <div class="flashcard-front">
                            <div class="hanzi" id="flashcardHanzi">你好</div>
                            <div class="tap-hint">Tap to flip</div>
                            <button class="audio-btn" id="audioBtn" aria-label="Play pronunciation">🔊</button>
                        </div>
                        <div class="flashcard-back">
                            <div class="pinyin" id="flashcardPinyin">nǐ hǎo</div>
                            <div class="uzbek" id="flashcardUzbek">Salom</div>
                            <div class="stroke-order-container">
                                <div id="strokeOrderTarget"></div>
                                <button class="stroke-btn" id="strokeBtn">Show Stroke Order</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card-controls">
                    <button class="control-btn" id="prevCard">Previous</button>
                    <button class="control-btn" id="shuffleCards">Shuffle</button>
                    <button class="control-btn" id="nextCard">Next</button>
                    <button class="control-btn" id="markLearned">Mark as Learned</button>
                </div>
                <div class="card-counter">
                    <span id="currentCard">1</span> / <span id="totalCards">5</span>
                    <span class="learned-counter">Learned: <span id="learnedCount">0</span></span>
                </div>
            </div>

            <!-- Quiz Mode -->
            <div id="quizMode" class="mode-content">
                <div class="quiz-header">
                    <div class="score-tracker">
                        Score: <span id="quizScore">0</span>
                    </div>
                </div>
                <div class="quiz-container">
                    <div class="quiz-question">
                        <div class="quiz-hanzi" id="quizHanzi">你好</div>
                        <p class="quiz-prompt">What does this mean?</p>
                    </div>
                    <div class="quiz-options" id="quizOptions"></div>
                </div>
                <div class="quiz-controls">
                    <button class="control-btn" id="nextQuizQuestion">Next Question</button>
                </div>
                <div class="quiz-counter">
                    Question: <span id="currentQuestion">1</span> / <span id="totalQuestions">5</span>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
